<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floral Katana</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0718; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
  const easeInOut = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

  /* ---------- sprites ---------- */

  const PALETTES = {
    white:   { inner: '#f7a8c4', mid: '#fff1f6', outer: '#ffffff', core: '#e0607f', stamen: '#ffd86b' },
    pale:    { inner: '#f284ad', mid: '#ffd9e6', outer: '#fff0f5', core: '#d9507a', stamen: '#ffd86b' },
    pink:    { inner: '#e0528a', mid: '#ffa9c8', outer: '#ffd3e2', core: '#c23a6c', stamen: '#ffe08a' },
    deep:    { inner: '#b81f5c', mid: '#f0679a', outer: '#ff9ebf', core: '#8f1245', stamen: '#ffe08a' },
    crimson: { inner: '#5c0a26', mid: '#a3173f', outer: '#d43b62', core: '#3d0518', stamen: '#ffc94d' },
    plum:    { inner: '#170a26', mid: '#3a1a52', outer: '#5d2f7a', core: '#0d0518', stamen: '#e9b6ff' },
    gold:    { inner: '#a8641a', mid: '#f0b842', outer: '#ffe9a3', core: '#8a4a10', stamen: '#fff6d0' }
  };

  function petalPath(g, r) {
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(-0.58 * r, -0.25 * r, -0.52 * r, -0.86 * r, -0.13 * r, -0.99 * r);
    g.lineTo(0, -0.85 * r);
    g.lineTo(0.13 * r, -0.99 * r);
    g.bezierCurveTo(0.52 * r, -0.86 * r, 0.58 * r, -0.25 * r, 0, 0);
    g.closePath();
  }

  function makeCanvas(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    return c;
  }

  function blossomSprite(p) {
    const S = 112, r = 48, c = makeCanvas(S), g = c.getContext('2d');
    g.translate(S / 2, S / 2);
    const grad = g.createRadialGradient(0, 0, 3, 0, 0, r);
    grad.addColorStop(0, p.inner);
    grad.addColorStop(0.5, p.mid);
    grad.addColorStop(1, p.outer);
    g.shadowColor = 'rgba(30, 0, 25, 0.55)';
    g.shadowBlur = 5;
    for (let i = 0; i < 5; i++) {
      g.save();
      g.rotate(i * TAU / 5);
      petalPath(g, r);
      g.fillStyle = grad;
      g.fill();
      g.restore();
    }
    g.shadowBlur = 0;
    // petal veins
    g.strokeStyle = p.inner;
    g.globalAlpha = 0.35;
    g.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) {
      g.save();
      g.rotate(i * TAU / 5);
      g.beginPath(); g.moveTo(0, -4); g.lineTo(0, -r * 0.6); g.stroke();
      g.restore();
    }
    g.globalAlpha = 1;
    g.strokeStyle = p.stamen;
    g.fillStyle = p.stamen;
    g.lineWidth = 1.4;
    for (let i = 0; i < 10; i++) {
      const a = i * TAU / 10 + 0.3, len = r * (i % 2 ? 0.34 : 0.26);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * len, Math.sin(a) * len); g.stroke();
      g.beginPath(); g.arc(Math.cos(a) * len, Math.sin(a) * len, 2.2, 0, TAU); g.fill();
    }
    g.fillStyle = p.core;
    g.beginPath(); g.arc(0, 0, 4.5, 0, TAU); g.fill();
    return c;
  }

  function leafSprite() {
    const S = 112, c = makeCanvas(S), g = c.getContext('2d');
    g.translate(S / 2, S / 2);
    const grad = g.createLinearGradient(0, 46, 0, -46);
    grad.addColorStop(0, '#1f5a3a');
    grad.addColorStop(1, '#8fd18a');
    g.shadowColor = 'rgba(0, 0, 0, 0.5)';
    g.shadowBlur = 4;
    g.beginPath();
    g.moveTo(0, 46);
    g.bezierCurveTo(-26, 20, -22, -24, 0, -48);
    g.bezierCurveTo(22, -24, 26, 20, 0, 46);
    g.fillStyle = grad;
    g.fill();
    g.shadowBlur = 0;
    g.strokeStyle = 'rgba(220, 255, 210, 0.5)';
    g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(0, 42); g.lineTo(0, -40); g.stroke();
    return c;
  }

  function fallingPetalSprite(inner, outer) {
    const S = 64, c = makeCanvas(S), g = c.getContext('2d');
    g.translate(S / 2, S / 2 + 26);
    const grad = g.createLinearGradient(0, 0, 0, -54);
    grad.addColorStop(0, inner);
    grad.addColorStop(1, outer);
    petalPath(g, 54);
    g.fillStyle = grad;
    g.fill();
    return c;
  }

  function glowSprite() {
    const S = 128, c = makeCanvas(S), g = c.getContext('2d');
    const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grad.addColorStop(0, 'rgba(255, 245, 250, 1)');
    grad.addColorStop(0.25, 'rgba(255, 190, 220, 0.55)');
    grad.addColorStop(1, 'rgba(255, 150, 200, 0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, S, S);
    return c;
  }

  const SPRITES = { leaf: leafSprite() };
  for (const k in PALETTES) SPRITES[k] = blossomSprite(PALETTES[k]);
  const PETALS = [
    fallingPetalSprite('#f48fb5', '#ffe3ee'),
    fallingPetalSprite('#ea6f9f', '#ffc9dc'),
    fallingPetalSprite('#f7b3cc', '#ffffff'),
    fallingPetalSprite('#d9588c', '#ffb0cc')
  ];
  const GLOW = glowSprite();

  /* ---------- scene state ---------- */

  let W = 0, H = 0, DPR = 1;
  let bg = null;
  let L = 0, angle = 0, cx = 0, cy = 0;
  let silhouette = [], blossoms = [], falling = [], bursts = [];
  let startTime = null; // set when F is pressed

  const SORI = 0.04;          // blade curvature
  const S_TSUBA = 0.235, S_HABAKI = 0.25, S_BLADE = 0.277, S_TIP = 0.945;
  const TRACE_TIME = 1.6, BLOOM_START = 1.25, BLOOM_SPAN = 5.5, POP = 0.55;

  // Point on the katana: s runs pommel (0) to tip (1), off is the offset
  // across the width, positive toward the cutting edge.
  function kPoint(s, off) {
    const u = s - 0.5;
    const x = u * L, y = -4 * SORI * L * u * u + SORI * L * 0.33;
    const ty = -8 * SORI * u, n = Math.hypot(1, ty);
    return [x + (-ty / n) * off, y + (1 / n) * off];
  }

  function bladeHalf(s) {
    return L * (0.0165 - 0.0035 * (s - S_BLADE) / (1 - S_BLADE));
  }

  function bounds(s) {
    if (s < S_TSUBA) {
      const hw = 0.0175 * L * (s < 0.012 ? 0.6 + 0.4 * Math.sqrt(s / 0.012) : 1);
      return [-hw, hw];
    }
    if (s < S_HABAKI) return [-0.05 * L, 0.05 * L];
    if (s < S_BLADE) return [-0.018 * L, 0.018 * L];
    const hw = bladeHalf(s);
    if (s <= S_TIP) return [-hw, hw];
    const k = (s - S_TIP) / (1 - S_TIP);
    return [-hw, -hw + 2 * hw * (1 - Math.pow(k, 1.8))];
  }

  function buildKatana() {
    angle = W >= H ? -0.4 : -1.02;
    L = 0.84 * Math.min(W / Math.cos(angle), H / Math.abs(Math.sin(angle)));
    cx = W / 2; cy = H / 2;

    // silhouette samples, doubled at section breaks for crisp corners
    const ss = [];
    for (let i = 0; i <= 320; i++) ss.push(i / 320);
    for (const b of [S_TSUBA, S_HABAKI, S_BLADE]) ss.push(b - 1e-5, b + 1e-5);
    ss.sort((a, b) => a - b);
    silhouette = ss.map(s => {
      const [lo, hi] = bounds(s);
      return { s, up: kPoint(s, lo), dn: kPoint(s, hi) };
    });

    blossoms = [];
    const add = (s, off, r, pal, order) => {
      const [x, y] = kPoint(s, off);
      blossoms.push({
        s, x, y, r, pal,
        rot: rand(0, TAU), phase: rand(0, TAU),
        order: (order === undefined ? s : order) + rand(-0.012, 0.012)
      });
    };

    // handle: woven diamond pattern
    const hh = 0.0175 * L, hr = hh * 0.56;
    let i = 0;
    for (let s = 0.02; s < S_TSUBA - 0.012; s += hr * 1.15 / L, i++) {
      add(s, -hh * 0.62, hr, i % 2 ? 'crimson' : 'plum');
      add(s + hr * 0.55 / L, 0, hr * 0.95, i % 2 ? 'plum' : 'pale');
      add(s, hh * 0.62, hr, i % 2 ? 'crimson' : 'plum');
    }
    add(0.007, 0, hh * 1.05, 'gold');                       // pommel
    add(S_TSUBA - 0.009, -hh * 0.5, hh * 0.6, 'gold');      // collar
    add(S_TSUBA - 0.009, hh * 0.5, hh * 0.6, 'gold');

    // guard
    const tr = 0.0105 * L, sm = (S_TSUBA + S_HABAKI) / 2;
    for (let off = -0.047 * L, j = 0; off <= 0.0471 * L; off += tr * 1.05, j++) {
      add(sm + (j % 2 ? 0.004 : -0.004), off, tr, 'gold');
    }
    add(sm, -0.052 * L, tr * 1.5, 'deep');
    add(sm, 0.052 * L, tr * 1.5, 'deep');
    add(sm - 0.006, -0.062 * L, tr * 1.7, 'leaf');
    add(sm + 0.006, 0.062 * L, tr * 1.7, 'leaf');

    // blade collar
    for (const s of [S_HABAKI + 0.008, S_HABAKI + 0.02]) {
      add(s, -0.008 * L, 0.0095 * L, 'gold');
      add(s, 0.008 * L, 0.0095 * L, 'gold');
    }

    // blade: deep spine, pale body, white cutting edge
    i = 0;
    const step = 0.0098;
    for (let s = S_BLADE + 0.006; s < 0.999; s += step, i++) {
      const [lo, hi] = bounds(s), w = hi - lo, k = Math.max(0.22, w / (2 * bladeHalf(s)));
      const base = bladeHalf(s) * k;
      const s2 = Math.min(0.999, s + step / 2), [lo2, hi2] = bounds(s2);
      add(s, lo + w * 0.2, base * 0.7, i % 9 === 4 ? 'deep' : 'pink');
      add(s2, lo2 + (hi2 - lo2) * 0.5, base * 0.66, 'pale');
      add(s, lo + w * 0.82, base * 0.6, 'white');
      add(s2, lo2 + (hi2 - lo2) * 0.86, base * 0.5, 'white');
      if (i % 8 === 3 && s < S_TIP) add(s, lo - base * 0.55, base * 0.85, 'leaf');
      if (i % 11 === 6 && s < S_TIP) add(s, lo + w * 0.12, base * 1.05, 'deep');
    }
    add(0.999, bounds(0.999)[0] + 1, Math.max(2, L * 0.0035), 'white');

    blossoms.sort((a, b) => a.order - b.order);
    const dt = BLOOM_SPAN / blossoms.length;
    blossoms.forEach((b, n) => { b.birth = BLOOM_START + n * dt; b.born = false; });
  }

  function buildBackground() {
    bg = document.createElement('canvas');
    bg.width = canvas.width; bg.height = canvas.height;
    const g = bg.getContext('2d');
    g.scale(DPR, DPR);

    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#070512');
    sky.addColorStop(0.45, '#170d2b');
    sky.addColorStop(0.8, '#33173a');
    sky.addColorStop(1, '#4a1d40');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    for (let i = 0; i < 140; i++) {
      g.globalAlpha = rand(0.15, 0.7);
      g.fillStyle = '#ffeef6';
      g.beginPath();
      g.arc(rand(0, W), rand(0, H * 0.7), rand(0.3, 1.2), 0, TAU);
      g.fill();
    }
    g.globalAlpha = 1;

    // moon and halo
    const mx = W * 0.78, my = H * 0.22, mr = Math.min(W, H) * 0.11;
    const halo = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 5);
    halo.addColorStop(0, 'rgba(255, 190, 220, 0.30)');
    halo.addColorStop(0.3, 'rgba(230, 130, 190, 0.10)');
    halo.addColorStop(1, 'rgba(200, 100, 180, 0)');
    g.fillStyle = halo;
    g.fillRect(0, 0, W, H);
    const moon = g.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
    moon.addColorStop(0, '#fffafc');
    moon.addColorStop(0.7, '#ffe1ec');
    moon.addColorStop(1, '#f5b8d2');
    g.fillStyle = moon;
    g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();

    // low pink mist
    for (let i = 0; i < 7; i++) {
      const x = rand(0, W), y = H * rand(0.85, 1.05), r = Math.max(W, H) * rand(0.2, 0.4);
      const m = g.createRadialGradient(x, y, 0, x, y, r);
      m.addColorStop(0, 'rgba(255, 140, 190, 0.10)');
      m.addColorStop(1, 'rgba(255, 140, 190, 0)');
      g.fillStyle = m;
      g.fillRect(0, 0, W, H);
    }

    const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);
  }

  function newFalling(anywhere) {
    const z = Math.pow(Math.random(), 1.6) * 0.75 + 0.25;
    return {
      x: rand(-0.1 * W, 1.1 * W),
      y: anywhere ? rand(-0.1 * H, H) : -30,
      z, size: 5 + 15 * z,
      rot: rand(0, TAU), vr: rand(-1.2, 1.2),
      flip: rand(0, TAU), vflip: rand(1, 3.2),
      sway: rand(0, TAU), vsway: rand(0.6, 1.6),
      sprite: PETALS[(Math.random() * PETALS.length) | 0]
    };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildBackground();
    buildKatana();
    const count = Math.round(clamp(W * H / 9000, 70, 220));
    falling = Array.from({ length: count }, () => newFalling(true));
    bursts = [];
  }

  /* ---------- drawing ---------- */

  function drawPetal(p, alpha) {
    const s = p.size;
    ctx.globalAlpha = alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(1, Math.cos(p.flip) * 0.85 + 0.15);
    ctx.drawImage(p.sprite, -s, -s, 2 * s, 2 * s);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function updateFalling(dt, t) {
    const wind = 28 + 22 * Math.sin(t * 0.31) + 10 * Math.sin(t * 0.83);
    for (const p of falling) {
      p.sway += p.vsway * dt;
      p.flip += p.vflip * dt;
      p.rot += p.vr * dt;
      p.y += (26 + 80 * p.z) * dt;
      p.x += (wind + Math.sin(p.sway) * 34) * p.z * dt;
      if (p.y > H + 30 || p.x > W * 1.12) {
        Object.assign(p, newFalling(false));
        if (Math.random() < 0.3) { p.x = -20; p.y = rand(0, H * 0.7); }
      }
    }
  }

  function drawSilhouette(T, done) {
    const p = easeInOut(clamp(T / TRACE_TIME));
    let n = 0;
    while (n < silhouette.length && silhouette[n].s <= p) n++;
    if (n < 2) return;

    ctx.beginPath();
    ctx.moveTo(silhouette[0].up[0], silhouette[0].up[1]);
    for (let i = 1; i < n; i++) ctx.lineTo(silhouette[i].up[0], silhouette[i].up[1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(silhouette[i].dn[0], silhouette[i].dn[1]);
    ctx.closePath();

    ctx.fillStyle = 'rgba(48, 10, 40, 0.6)';
    ctx.fill();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = 'rgba(255, 150, 200, 0.95)';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = `rgba(255, 228, 240, ${0.95 - 0.6 * done})`;
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (p < 1) {
      const [x, y] = kPoint(p, 0), r = L * 0.06;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(GLOW, x - r, y - r, 2 * r, 2 * r);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawKatana(T, t) {
    const bob = Math.sin(t * 0.9) * 5;
    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    const total = BLOOM_START + BLOOM_SPAN + POP;
    const done = clamp((T - BLOOM_START) / BLOOM_SPAN);

    ctx.translate(cx, cy + bob);
    ctx.rotate(angle);
    ctx.globalAlpha = clamp(T / 0.4);
    drawSilhouette(T, done);
    ctx.globalAlpha = 1;

    // periodic sheen running up the blade once it is complete
    let sheen = -1;
    if (T > total + 0.4) {
      const c = (T - total - 0.4) % 5;
      if (c < 1.3) sheen = S_BLADE - 0.05 + (c / 1.3) * (1.1 - S_BLADE);
    }

    for (const b of blossoms) {
      const age = T - b.birth;
      if (age <= 0) break;
      if (!b.born) {
        b.born = true;
        if (Math.random() < 0.3) {
          const p = newFalling(false);
          p.x = cx + b.x * cosA - b.y * sinA;
          p.y = cy + bob + b.x * sinA + b.y * cosA;
          p.size = rand(4, 8);
          p.vx = rand(-60, 60); p.vy = rand(-90, -10); p.life = 1;
          bursts.push(p);
        }
      }
      let k = age < POP ? easeOutBack(age / POP) : 1;
      let glow = age < 0.45 ? (1 - age / 0.45) * 0.4 : 0;
      if (sheen >= 0) {
        const d = (b.s - sheen) / 0.035, g = Math.exp(-d * d);
        k *= 1 + 0.22 * g;
        glow = Math.max(glow, g * 0.7);
      }
      const R = b.r * 1.18 * k;
      const a = b.rot + Math.sin(t * 1.3 + b.phase) * 0.18;
      const c = Math.cos(a), s = Math.sin(a);
      ctx.transform(c, s, -s, c, b.x, b.y);
      ctx.drawImage(SPRITES[b.pal], -R, -R, 2 * R, 2 * R);
      ctx.transform(c, -s, s, c, 0, 0);
      ctx.translate(-b.x, -b.y);
      if (glow > 0.01) {
        const gr = b.r * 3.2;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = glow;
        ctx.drawImage(GLOW, b.x - gr, b.y - gr, 2 * gr, 2 * gr);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function drawBursts(dt) {
    for (let i = bursts.length - 1; i >= 0; i--) {
      const p = bursts[i];
      p.life -= dt * 0.55;
      if (p.life <= 0) { bursts.splice(i, 1); continue; }
      p.vy += 120 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * 2 * dt; p.flip += p.vflip * dt;
      drawPetal(p, clamp(p.life * 1.5));
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000;
    last = now;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    updateFalling(dt, t);
    for (const p of falling) if (p.z <= 0.88) drawPetal(p, 0.3 + 0.65 * p.z);
    ctx.globalAlpha = 1;

    if (startTime !== null) {
      drawKatana((now - startTime) / 1000, t);
      drawBursts(dt);
    }

    // nearest petals pass in front of the blade
    for (const p of falling) if (p.z > 0.88) drawPetal(p, 0.9);
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  window.addEventListener('keydown', e => {
    if (e.code !== 'KeyF' && e.key !== 'f' && e.key !== 'F') return;
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    startTime = performance.now();
    bursts = [];
    for (const b of blossoms) b.born = false;
  });
  window.addEventListener('resize', resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
