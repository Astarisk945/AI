<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floral Katana</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0418; overflow: hidden; }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: grab; touch-action: none;
  }
  canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---------- low-res framebuffer + z-buffer (software rasterizer) ----------
  let W = 0, H = 0, img, fb, zb, focal = 1;
  function resize() {
    const scale = Math.max(1, Math.round(innerHeight / 460));
    W = Math.max(64, Math.ceil(innerWidth / scale));
    H = Math.max(64, Math.ceil(innerHeight / scale));
    canvas.width = W; canvas.height = H;
    img = ctx.createImageData(W, H);
    fb = new Uint32Array(img.data.buffer);
    zb = new Float32Array(W * H);
    focal = H * 1.15;
  }
  resize();
  addEventListener('resize', resize);

  const rgb = (r, g, b) => (255 << 24 | (b & 255) << 16 | (g & 255) << 8 | (r & 255)) >>> 0;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // z values are inverse depth: larger is nearer
  function tri(x0, y0, z0, x1, y1, z1, x2, y2, z2, col) {
    const area = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
    if (area === 0) return;
    let minX = Math.floor(Math.min(x0, x1, x2)), maxX = Math.ceil(Math.max(x0, x1, x2));
    let minY = Math.floor(Math.min(y0, y1, y2)), maxY = Math.ceil(Math.max(y0, y1, y2));
    if (minX < 0) minX = 0; if (minY < 0) minY = 0;
    if (maxX > W - 1) maxX = W - 1; if (maxY > H - 1) maxY = H - 1;
    const inv = 1 / area;
    for (let y = minY; y <= maxY; y++) {
      const py = y + 0.5, row = y * W;
      for (let x = minX; x <= maxX; x++) {
        const px = x + 0.5;
        const w0 = ((x1 - px) * (y2 - py) - (x2 - px) * (y1 - py)) * inv;
        if (w0 < 0) continue;
        const w1 = ((x2 - px) * (y0 - py) - (x0 - px) * (y2 - py)) * inv;
        if (w1 < 0) continue;
        const w2 = 1 - w0 - w1;
        if (w2 < 0) continue;
        const z = w0 * z0 + w1 * z1 + w2 * z2, i = row + x;
        if (z > zb[i]) { zb[i] = z; fb[i] = col; }
      }
    }
  }

  // ---------- katana curve (local space: blade along +x, spine toward +y) ----------
  const L = 3.9, HANDLE = -0.95, CURVE = 0.03, PIVOT = 1.45;
  const LIGHT = norm([0.35, 0.8, 0.5]);

  function norm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function frame(s) {
    const tl = Math.hypot(1, 2 * CURVE * s);
    const tx = 1 / tl, ty = 2 * CURVE * s / tl;
    return { px: s, py: CURVE * s * s, tx, ty, nx: -ty, ny: tx };
  }
  // point at arc position s, offset a toward the spine and b sideways
  function pt(s, a, b) { const f = frame(s); return [f.px + f.nx * a, f.py + f.ny * a, b]; }
  const tipQ = s => clamp((s - (L - 0.6)) / 0.6, 0, 1);
  const bladeTop = s => 0.085 - 0.012 * (s / L);
  const bladeBot = s => { const h = bladeTop(s), q = tipQ(s); return -h + 2 * h * q * q; };

  // ---------- base mesh (revealed first, as the katana "appears") ----------
  const mPos = [], mCol = [], mKey = [];
  function addTri(a, b, c, col, key) {
    const n = norm(cross([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [c[0] - a[0], c[1] - a[1], c[2] - a[2]]));
    const l = 0.45 + 0.55 * Math.abs(n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
    mPos.push(...a, ...b, ...c);
    mCol.push([col[0] * l, col[1] * l, col[2] * l]);
    mKey.push(key);
  }
  function loft(rings, keys, colFn) {
    for (let i = 0; i < rings.length - 1; i++) {
      const A = rings[i], B = rings[i + 1], n = A.length;
      for (let j = 0; j < n; j++) {
        const k = (j + 1) % n, col = colFn(i, j), key = (keys[i] + keys[i + 1]) / 2;
        addTri(A[j], A[k], B[k], col, key);
        addTri(A[j], B[k], B[j], col, key);
      }
    }
  }
  function cap(ring, center, col, key) {
    for (let j = 0; j < ring.length; j++) addTri(center, ring[j], ring[(j + 1) % ring.length], col, key);
  }
  {
    const rings = [], keys = [];
    for (let i = 0; i <= 28; i++) {
      const s = L * i / 28, t = 0.024 * (1 - tipQ(s) * 0.85);
      rings.push([pt(s, bladeTop(s), -t), pt(s, bladeTop(s), t), pt(s, bladeBot(s), 0)]);
      keys.push(s);
    }
    loft(rings, keys, (i, j) => j === 0 ? [226, 168, 198] : [246, 218, 232]);

    const hr = [], hk = [];
    for (let i = 0; i <= 10; i++) {
      const s = HANDLE + (-0.03 - HANDLE) * i / 10, ring = [];
      for (let j = 0; j < 6; j++) { const a = j / 6 * Math.PI * 2; ring.push(pt(s, Math.cos(a) * 0.075, Math.sin(a) * 0.05)); }
      hr.push(ring); hk.push(s);
    }
    loft(hr, hk, (i, j) => (i + j) & 1 ? [70, 34, 86] : [118, 60, 128]);
    cap(hr[0], pt(HANDLE - 0.03, 0, 0), [150, 110, 150], HANDLE);

    const g0 = [], g1 = [];
    for (let j = 0; j < 10; j++) {
      const a = j / 10 * Math.PI * 2;
      g0.push(pt(-0.03, Math.cos(a) * 0.25, Math.sin(a) * 0.25));
      g1.push(pt(0.015, Math.cos(a) * 0.25, Math.sin(a) * 0.25));
    }
    loft([g0, g1], [-0.03, 0.015], () => [170, 120, 160]);
    cap(g0, pt(-0.03, 0, 0), [140, 90, 140], -0.03);
    cap(g1, pt(0.015, 0, 0), [140, 90, 140], 0.015);
  }
  const meshPos = new Float32Array(mPos), meshN = mKey.length;

  // ---------- blossoms ----------
  const PINKS = [[255, 170, 200], [255, 150, 188], [250, 190, 214], [244, 132, 176], [255, 204, 224]];
  const PALES = [[255, 240, 246], [250, 228, 238], [238, 224, 238], [255, 220, 234]];
  const raw = [];
  // pink: 0 = pale/silver, 1 = pink
  function addBlossom(p, n, r, pink, key) {
    n = norm([n[0] + (Math.random() - 0.5) * 0.4, n[1] + (Math.random() - 0.5) * 0.4, n[2] + (Math.random() - 0.5) * 0.4]);
    const u = norm(cross(n, Math.abs(n[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0])), v = cross(n, u);
    const lift = 0.006 + Math.random() * 0.05, cup = 0.1 + Math.random() * 0.25, tone = 0.86 + Math.random() * 0.2;
    const a0 = Math.random() * Math.PI * 2;
    const isPink = Math.random() < pink;
    const base = isPink ? PINKS[Math.random() * PINKS.length | 0] : PALES[Math.random() * PALES.length | 0];
    const heart = isPink ? [222, 70, 124] : [236, 112, 160];
    const off = [], cols = [];
    const shade = (c, l) => [clamp(c[0] * l, 0, 255), clamp(c[1] * l, 0, 255), clamp(c[2] * l, 0, 255)];
    const lit = (q, w) => {
      const fn = norm(cross(q, w));
      return tone * (0.86 + 0.14 * Math.abs(fn[0] * LIGHT[0] + fn[1] * LIGHT[1] + fn[2] * LIGHT[2]));
    };
    const ring = (a, fd, fe, fn) => {
      const ca = Math.cos(a), sa = Math.sin(a);
      return [
        r * ((u[0] * ca + v[0] * sa) * fd + (-u[0] * sa + v[0] * ca) * fe + n[0] * fn),
        r * ((u[1] * ca + v[1] * sa) * fd + (-u[1] * sa + v[1] * ca) * fe + n[1] * fn),
        r * ((u[2] * ca + v[2] * sa) * fd + (-u[2] * sa + v[2] * ca) * fe + n[2] * fn)];
    };
    // five rounded petals, each with the cleft tip of a cherry blossom
    for (let j = 0; j < 5; j++) {
      const a = a0 + j * Math.PI * 0.4;
      const Lp = ring(a, 0.56, 0.31, cup * 0.3), LT = ring(a, 0.97, 0.2, cup * 0.9), N = ring(a, 0.74, 0, cup * 0.7);
      const RT = ring(a, 0.97, -0.2, cup * 0.9), Rp = ring(a, 0.56, -0.31, cup * 0.3);
      off.push(...Lp, ...LT, ...N, ...RT, ...Rp);
      const l1 = lit(Lp, LT), l2 = lit(RT, Rp), blush = [base[0] * 0.62 + heart[0] * 0.38, base[1] * 0.62 + heart[1] * 0.38, base[2] * 0.62 + heart[2] * 0.38];
      cols.push(shade(blush, (l1 + l2) / 2), shade(base, l1), shade(base, (l1 + l2) / 2 + 0.03), shade(base, l2));
    }
    // deep rose star in the heart of the flower, showing between the petals
    for (let j = 0; j < 5; j++) off.push(...ring(a0 + (j + 0.5) * Math.PI * 0.4, 0.22, 0, cup * 0.12 + 0.04));
    off.push(n[0] * r * 0.16, n[1] * r * 0.16, n[2] * r * 0.16);
    cols.push(shade(heart, tone));
    raw.push({ c: [p[0] + n[0] * lift, p[1] + n[1] * lift, p[2] + n[2] * lift], off, cols, key: key + (Math.random() - 0.5) * 0.3 });
  }
  {
    const R = Math.random;
    for (let i = 0; i < 300; i++) {            // blade flats: pink near the spine, silver near the edge
      const s = 0.04 + R() * (L - 0.06), top = bladeTop(s), bot = bladeBot(s), m = R(), side = R() < 0.5 ? -1 : 1;
      addBlossom(pt(s, bot + (top - bot) * m, side * 0.02), [0, 0, side], (0.085 + R() * 0.05) * (1 - tipQ(s) * 0.5), 0.12 + m * 0.85, s);
    }
    for (let i = 0; i < 70; i++) {            // spine
      const s = 0.04 + R() * (L - 0.05), f = frame(s);
      addBlossom(pt(s, bladeTop(s), (R() - 0.5) * 0.04), [f.nx, f.ny, 0], (0.085 + R() * 0.05) * (1 - tipQ(s) * 0.5), 0.95, s);
    }
    for (let i = 0; i < 70; i++) {            // cutting edge
      const s = 0.04 + R() * (L - 0.05), f = frame(s);
      addBlossom(pt(s, bladeBot(s), 0), [-f.nx, -f.ny, 0], (0.075 + R() * 0.045) * (1 - tipQ(s) * 0.5), 0.1, s);
    }
    for (let i = 0; i < 110; i++) {            // handle
      const s = HANDLE + R() * (-0.05 - HANDLE), a = R() * Math.PI * 2, f = frame(s);
      addBlossom(pt(s, Math.cos(a) * 0.075, Math.sin(a) * 0.05), [f.nx * Math.cos(a), f.ny * Math.cos(a), Math.sin(a)], 0.08 + R() * 0.045, i % 5 ? 0.9 : 0.2, s);
    }
    for (let i = 0; i < 18; i++) {             // pommel
      const f = frame(HANDLE);
      addBlossom(pt(HANDLE - 0.02, (R() - 0.5) * 0.1, (R() - 0.5) * 0.07), [-f.tx, -f.ty, 0], 0.05 + R() * 0.04, 0.5, HANDLE);
    }
    for (let i = 0; i < 70; i++) {            // guard: faces and rim, larger and spikier
      const a = R() * Math.PI * 2, rim = i % 3 === 0, rr = rim ? 0.25 : 0.09 + R() * 0.16, side = R() < 0.5 ? -1 : 1;
      const p = pt(rim ? -0.008 : side < 0 ? -0.03 : 0.015, Math.cos(a) * rr, Math.sin(a) * rr);
      addBlossom(p, rim ? [0, Math.cos(a), Math.sin(a)] : [side, 0, 0], 0.12 + R() * 0.07, 0.7, -0.01);
    }
  }
  raw.sort((a, b) => a.key - b.key);
  const BN = raw.length;
  const bC = new Float32Array(BN * 3), bOff = new Float32Array(BN * 93), bCol = new Uint8Array(BN * 63);
  const bBirth = new Float32Array(BN), bPhase = new Float32Array(BN), bBorn = new Uint8Array(BN);
  const TRACE = 1.15, BLOOM = 5.2, POP = 0.45;
  raw.forEach((b, i) => {
    bC.set(b.c, i * 3); bOff.set(b.off, i * 93);
    b.cols.forEach((c, j) => bCol.set(c, i * 63 + j * 3));
    // slow start, so the first blossoms visibly open one at a time
    bBirth[i] = TRACE * 0.85 + BLOOM * Math.pow(i / BN, 0.62);
    bPhase[i] = Math.random() * 6.28;
  });

  // ---------- falling petals ----------
  const PN = 260, petals = [];
  const PETAL_COLS = [[255, 170, 205], [240, 140, 185], [255, 205, 225], [200, 120, 160], [235, 215, 235]];
  function spawnPetal(p, fresh) {
    const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 8.5;
    p.x = Math.cos(a) * r; p.z = Math.sin(a) * r;
    p.y = fresh ? Math.random() * 7 : 6 + Math.random() * 2.5;
    p.vy = 0.3 + Math.random() * 0.5;
    p.sw = 0.15 + Math.random() * 0.35; p.sp = Math.random() * 6.28; p.sf = 0.5 + Math.random();
    p.th = Math.random() * 6.28; p.ph = Math.random() * 6.28; p.ps = Math.random() * 6.28;
    p.w1 = (Math.random() - 0.5) * 3; p.w2 = (Math.random() - 0.5) * 2; p.w3 = 1 + Math.random() * 3;
    p.len = 0.05 + Math.random() * 0.075; p.wid = p.len * (0.5 + Math.random() * 0.25);
    p.col = PETAL_COLS[Math.random() * PETAL_COLS.length | 0];
  }
  for (let i = 0; i < PN; i++) { const p = {}; spawnPetal(p, true); petals.push(p); }
  let shedIdx = 0;
  function shed(x, y, z) {
    const p = petals[shedIdx = (shedIdx + 1) % PN];
    spawnPetal(p, false);
    p.x = x; p.y = y; p.z = z; p.vy = 0.25 + Math.random() * 0.3;
  }

  // ---------- stars ----------
  const stars = [];
  for (let i = 0; i < 140; i++) {
    const a = Math.random() * 6.283, y = 0.06 + Math.random() * 0.9, r = Math.sqrt(1 - y * y);
    stars.push([Math.cos(a) * r, y, Math.sin(a) * r, 60 + Math.random() * 110, Math.random() * 6.28]);
  }

  // ---------- camera + input ----------
  let yaw = -0.25, pitch = 0.17, dist = 5.6, yawVel = 0, pitchVel = 0;
  let dragging = false, lastX = 0, lastY = 0, lastInput = -1e9;
  const AUTO = 0.07;
  canvas.addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yaw -= dx * 0.006; pitch = clamp(pitch + dy * 0.005, 0.03, 1.35);
    yawVel = -dx * 0.006 * 60; pitchVel = dy * 0.005 * 60;
    lastInput = performance.now();
  });
  const endDrag = () => { dragging = false; canvas.classList.remove('dragging'); lastInput = performance.now(); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    dist = clamp(dist * Math.exp(e.deltaY * 0.001), 3.2, 13);
  }, { passive: false });

  let startTime = null;
  addEventListener('keydown', e => {
    if (e.code !== 'KeyF' && e.key !== 'f' && e.key !== 'F') return;
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    startTime = performance.now();
    bBorn.fill(0);
  });

  // ---------- frame ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - 0.5) * 4);
  const easeBack = x => { const c = 2.2, y = x - 1; return 1 + (c + 1) * y * y * y + c * y * y; };
  let prev = performance.now(), shedAcc = 0;

  function render(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    const time = now / 1000;
    const t = startTime === null ? -1 : (now - startTime) / 1000;

    if (!dragging) {
      // coast after a drag, then ease back into a slow orbit
      const idle = clamp((now - lastInput) / 1800 - 0.4, 0, 1);
      yawVel += (AUTO * idle - yawVel) * Math.min(1, dt * 2.5);
      pitchVel *= Math.exp(-dt * 4);
      yaw += yawVel * dt; pitch = clamp(pitch + pitchVel * dt, 0.03, 1.35);
    }

    // camera basis
    const tgtY = 1.65, cp = Math.cos(pitch), sp = Math.sin(pitch);
    const camX = Math.sin(yaw) * cp * dist, camY = tgtY + sp * dist, camZ = Math.cos(yaw) * cp * dist;
    const Fx = -Math.sin(yaw) * cp, Fy = -sp, Fz = -Math.cos(yaw) * cp;
    const Rx = Math.cos(yaw), Rz = -Math.sin(yaw);               // right = F x up (Ry = 0)
    const Ux = -Rz * Fy, Uy = Rz * Fx - Rx * Fz, Uz = Rx * Fy;    // up = R x F
    const cx = W / 2, cy = H / 2;

    // katana model matrix: tilt tip-up, slight roll, gentle bob
    const tilt = 0.47 + Math.sin(time * 0.7) * 0.015, roll = Math.sin(time * 0.9) * 0.1;
    const C = Math.cos(tilt), S = Math.sin(tilt), c = Math.cos(roll), s = Math.sin(roll);
    const M = [C, -S * c, S * s, S, C * c, -C * s, 0, s, c];
    const mx = 0, my = 1.75 + Math.sin(time * 1.1) * 0.05, mz = 0;
    const pvx = PIVOT, pvy = CURVE * PIVOT * PIVOT;
    // combined local -> view rotation and translation
    const A = [
      Rx * M[0] + Rz * M[6], Rx * M[1] + Rz * M[7], Rx * M[2] + Rz * M[8],
      Ux * M[0] + Uy * M[3] + Uz * M[6], Ux * M[1] + Uy * M[4] + Uz * M[7], Ux * M[2] + Uy * M[5] + Uz * M[8],
      Fx * M[0] + Fy * M[3] + Fz * M[6], Fx * M[1] + Fy * M[4] + Fz * M[7], Fx * M[2] + Fy * M[5] + Fz * M[8]];
    const ox = mx - camX, oy = my - camY, oz = mz - camZ;
    const Tx = Rx * ox + Rz * oz, Ty = Ux * ox + Uy * oy + Uz * oz, Tz = Fx * ox + Fy * oy + Fz * oz;

    const bloomed = t < 0 ? 0 : clamp((t - TRACE * 0.85) / BLOOM, 0, 1);
    const glow = t < 0 ? 0 : Math.max(bloomed, clamp(t / TRACE, 0, 1) * 0.35);

    // --- background: sky gradient + raycast checker floor ---
    zb.fill(0);
    const half = (L - HANDLE) / 2 * C;
    for (let y = 0; y < H; y++) {
      const v = (cy - y - 0.5) / focal;
      const bx = Fx + Ux * v, by = Fy + Uy * v, bz = Fz + Uz * v;
      const row = y * W;
      if (by >= -0.002) {
        const k = clamp(by / Math.hypot(bx, by, bz) * 1.6, 0, 1);
        const col = rgb(24 - 15 * k, 11 - 7 * k, 40 - 20 * k);
        for (let x = 0; x < W; x++) fb[row + x] = col;
        continue;
      }
      const tt = -camY / by, fog = 1 / (1 + tt * tt * 0.011);
      for (let x = 0; x < W; x++) {
        const u = (x + 0.5 - cx) / focal;
        const wx = camX + (bx + Rx * u) * tt, wz = camZ + (bz + Rz * u) * tt;
        const light = (Math.floor(wx / 1.25) + Math.floor(wz / 1.25)) & 1;
        const dx = wx - clamp(wx, -half, half), g = glow * 0.5 / (1 + (dx * dx + wz * wz) * 0.9);
        const r = light ? 66 : 30, gg = light ? 40 : 15, b = light ? 104 : 54;
        fb[row + x] = rgb(24 + (r - 24) * fog + 80 * g * fog, 11 + (gg - 11) * fog + 22 * g * fog, 40 + (b - 40) * fog + 60 * g * fog);
      }
    }
    for (const st of stars) {
      const dx = st[0], dy = st[1], dz = st[2];
      const vz = Fx * dx + Fy * dy + Fz * dz;
      if (vz < 0.1) continue;
      const sx = cx + focal * (Rx * dx + Rz * dz) / vz | 0, sy = cy - focal * (Ux * dx + Uy * dy + Uz * dz) / vz | 0;
      if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
      const b = st[3] * (0.7 + 0.3 * Math.sin(time * 1.5 + st[4]));
      fb[sy * W + sx] = rgb(b * 0.95, b * 0.8, b);
    }

    // --- katana body: sweeps in from pommel to tip ---
    if (t >= 0) {
      const e = clamp(t / TRACE, 0, 1), front = HANDLE - 0.1 + (L - HANDLE + 0.5) * (1 - (1 - e) * (1 - e));
      const sc = new Float32Array(9);
      for (let i = 0; i < meshN; i++) {
        const key = mKey[i];
        if (key > front) continue;
        let ok = true;
        for (let j = 0; j < 3; j++) {
          const lx = meshPos[i * 9 + j * 3] - pvx, ly = meshPos[i * 9 + j * 3 + 1] - pvy, lz = meshPos[i * 9 + j * 3 + 2];
          const z = A[6] * lx + A[7] * ly + A[8] * lz + Tz;
          if (z < 0.25) { ok = false; break; }
          sc[j * 3] = cx + focal * (A[0] * lx + A[1] * ly + A[2] * lz + Tx) / z;
          sc[j * 3 + 1] = cy - focal * (A[3] * lx + A[4] * ly + A[5] * lz + Ty) / z;
          sc[j * 3 + 2] = 1 / z;
        }
        if (!ok) continue;
        const hot = clamp(1 - (front - key) / 0.45, 0, 1), col = mCol[i];
        tri(sc[0], sc[1], sc[2], sc[3], sc[4], sc[5], sc[6], sc[7], sc[8],
          rgb(col[0] + (255 - col[0]) * hot, col[1] + (225 - col[1]) * hot, col[2] + (245 - col[2]) * hot));
      }

      // --- blossoms: open one by one along the katana ---
      const P = new Float32Array(93);
      for (let i = 0; i < BN; i++) {
        const age = t - bBirth[i];
        if (age < 0) break;
        const lx = bC[i * 3] - pvx, ly = bC[i * 3 + 1] - pvy, lz = bC[i * 3 + 2];
        if (!bBorn[i]) {
          bBorn[i] = 1;
          if (Math.random() < 0.035) shed(M[0] * lx + M[1] * ly + M[2] * lz + mx, M[3] * lx + M[4] * ly + M[5] * lz + my, M[6] * lx + M[7] * ly + M[8] * lz + mz);
        }
        const vx = A[0] * lx + A[1] * ly + A[2] * lz + Tx, vy = A[3] * lx + A[4] * ly + A[5] * lz + Ty, vz = A[6] * lx + A[7] * ly + A[8] * lz + Tz;
        if (vz < 0.4) continue;
        const k = (age >= POP ? 1 : easeBack(age / POP)) * (1 + 0.05 * Math.sin(time * 2.2 + bPhase[i]));
        const flash = age < 0.7 ? 1 - age / 0.7 : 0;
        const o = i * 93;
        for (let j = 0; j < 31; j++) {
          const qx = bOff[o + j * 3] * k, qy = bOff[o + j * 3 + 1] * k, qz = bOff[o + j * 3 + 2] * k;
          const z = vz + A[6] * qx + A[7] * qy + A[8] * qz;
          P[j * 3] = cx + focal * (vx + A[0] * qx + A[1] * qy + A[2] * qz) / z;
          P[j * 3 + 1] = cy - focal * (vy + A[3] * qx + A[4] * qy + A[5] * qz) / z;
          P[j * 3 + 2] = 1 / z;
        }
        const sx = cx + focal * vx / vz, sy = cy - focal * vy / vz, sz = 1 / vz, cb = i * 63;
        const col = n => {
          const r = bCol[cb + n], g = bCol[cb + n + 1], b = bCol[cb + n + 2];
          return rgb(r + (255 - r) * flash, g + (250 - g) * flash, b + (255 - b) * flash);
        };
        for (let j = 0; j < 5; j++) {
          const a = j * 15, ci = j * 12;
          tri(sx, sy, sz, P[a], P[a + 1], P[a + 2], P[a + 12], P[a + 13], P[a + 14], col(ci));
          tri(P[a], P[a + 1], P[a + 2], P[a + 3], P[a + 4], P[a + 5], P[a + 6], P[a + 7], P[a + 8], col(ci + 3));
          tri(P[a], P[a + 1], P[a + 2], P[a + 6], P[a + 7], P[a + 8], P[a + 12], P[a + 13], P[a + 14], col(ci + 6));
          tri(P[a + 6], P[a + 7], P[a + 8], P[a + 9], P[a + 10], P[a + 11], P[a + 12], P[a + 13], P[a + 14], col(ci + 9));
        }
        const hc = col(60);
        for (let j = 0; j < 5; j++) {
          const a = 75 + j * 3, b = 75 + (j + 1) % 5 * 3;
          tri(P[90], P[91], P[92], P[a], P[a + 1], P[a + 2], P[b], P[b + 1], P[b + 2], hc);
        }
      }

      // once in bloom, the katana keeps shedding the odd petal
      if (bloomed >= 1) {
        shedAcc += dt;
        if (shedAcc > 0.5) {
          shedAcc = 0;
          const i = Math.random() * BN | 0, lx = bC[i * 3] - pvx, ly = bC[i * 3 + 1] - pvy, lz = bC[i * 3 + 2];
          shed(M[0] * lx + M[1] * ly + M[2] * lz + mx, M[3] * lx + M[4] * ly + M[5] * lz + my, M[6] * lx + M[7] * ly + M[8] * lz + mz);
        }
      }
    }

    // --- falling petals ---
    for (const p of petals) {
      p.y -= p.vy * dt;
      p.th += p.w1 * dt; p.ph += p.w2 * dt; p.ps += p.w3 * dt;
      if (p.y < 0.02) spawnPetal(p, false);
      const wx = p.x + Math.sin(time * p.sf + p.sp) * p.sw, wy = p.y, wz = p.z + Math.cos(time * p.sf * 0.8 + p.sp) * p.sw;
      const ct = Math.cos(p.th), stt = Math.sin(p.th), cph = Math.cos(p.ph), sph = Math.sin(p.ph);
      const ax = cph * ct, ay = stt, az = sph * ct;
      const b0x = -sph, b0z = cph;
      const b1x = ay * b0z, b1y = az * b0x - ax * b0z, b1z = -ay * b0x;
      const cs = Math.cos(p.ps), sn = Math.sin(p.ps);
      const bx = cs * b0x + sn * b1x, by = sn * b1y, bz = cs * b0z + sn * b1z;
      const nx = cs * b1x - sn * b0x, ny = cs * b1y, nz = cs * b1z - sn * b0z;
      const l = 0.5 + 0.5 * Math.abs(nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
      const fade = clamp(1.25 - Math.hypot(wx - camX, wz - camZ) / 16, 0.3, 1) * l;
      const col = rgb(p.col[0] * fade, p.col[1] * fade, p.col[2] * fade);
      const q = [];
      let ok = true;
      for (const [fa, fbk] of [[-p.len, 0], [0, p.wid], [p.len * 0.95, p.wid * 0.5], [p.len * 0.58, 0], [p.len * 0.95, -p.wid * 0.5], [0, -p.wid]]) {
        const dx = wx + ax * fa + bx * fbk - camX, dy = wy + ay * fa + by * fbk - camY, dz = wz + az * fa + bz * fbk - camZ;
        const z = Fx * dx + Fy * dy + Fz * dz;
        if (z < 1.3) { ok = false; break; }
        q.push(cx + focal * (Rx * dx + Rz * dz) / z, cy - focal * (Ux * dx + Uy * dy + Uz * dz) / z, 1 / z);
      }
      if (!ok) continue;
      for (let j = 3; j < 15; j += 3) tri(q[0], q[1], q[2], q[j], q[j + 1], q[j + 2], q[j + 3], q[j + 4], q[j + 5], col);
    }

    // --- retro finish: ordered dither to 5 bits per channel, soft scanlines ---
    for (let y = 0, i = 0; y < H; y++) {
      const line = y & 1 ? 0.94 : 1, br = (y & 3) * 4;
      for (let x = 0; x < W; x++, i++) {
        const px = fb[i], d = BAYER[br + (x & 3)];
        let r = (px & 255) + d, g = (px >> 8 & 255) + d, b = (px >> 16 & 255) + d;
        r = (r < 0 ? 0 : r > 255 ? 255 : r) & 0xFC; g = (g < 0 ? 0 : g > 255 ? 255 : g) & 0xFC; b = (b < 0 ? 0 : b > 255 ? 255 : b) & 0xFC;
        fb[i] = (255 << 24 | (b * line) << 16 | (g * line) << 8 | (r * line)) >>> 0;
      }
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
